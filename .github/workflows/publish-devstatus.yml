name: Publish dev status

# The website (mts-game.com/roadmap) reads devstatus.json from the `devstatus`
# branch. This job copies it there from whichever branch updated it, so the
# public roadmap follows work in progress without waiting for a merge to master.
# The newest `updatedAt` wins; pushes from older branches are skipped.

on:
  push:
    branches-ignore:
      - devstatus
    paths:
      - devstatus.json
      - tools/publish_devstatus.py
      - tools/validate_devstatus.py
      - .github/workflows/publish-devstatus.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-devstatus
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the publisher
        run: python -m unittest tools/test_validate_devstatus.py tools/test_publish_devstatus.py

      - name: Publish devstatus.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/publish_devstatus.py devstatus.json "${GITHUB_REF_NAME}"
